name: Main - Build, Test and Security

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and test
      run: mvn verify

    - name: Generate test report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 7

    - name: Cache NVD database
      uses: actions/cache@v4
      with:
        path: ~/.dependency-check/data
        key: nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: nvd-${{ runner.os }}-

    - name: Check dependency CVEs
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DnvdApiKey=$NVD_API_KEY
      continue-on-error: false

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/findmyservice-api-server:latest

    - name: Deploy to Render
      run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
