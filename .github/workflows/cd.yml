name: CD - Deploy to Render

on:
  workflow_run:
    workflows: [ "CI - Build, Test and Push" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Deploy to Render
      run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
